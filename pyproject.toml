[project]
name = "Serverless-S3-WebViz"
version = "0.1.0"
description = "A serverless, client-side web portal for real-time visualisation of virtualised datasets on S3 using Kerchunk and direct HTTP range queries"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.0",
    "cartopy>=0.25.0",
    "dask>=2026.3.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "ipykernel>=7.2.0",
    "kerchunk>=0.2.10",
    "pre-commit>=4.6.0",
    "requests>=2.34.2",
    "s3fs>=2026.4.0",
    "xarray>=2026.4.0",
]

[dependency-groups]
dev = [
    "netcdf4>=1.7.4",
    "pytest>=8.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath= "."
testpaths= ["tests"]

# Register markers to avoid warnings
markers= [
    "e2e: end-to-end integration tests that run against sample S3 targets",
    "integration: tests that require external dependencies or complex setups"
    ]
